<!DOCTYPE html>
<html lang="fr"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
  <meta charset="UTF-8">
  <title>Inscription</title>
  <link rel="stylesheet" href="Inscription_fichiers/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header text-center"><h4>Inscription utilisateur</h4></div>
        <div class="card-body">

          
          <form id="registerForm" method="post" action="register.php" novalidate="">
            <div id="formStatus" class="alert alert-warning">Erreur serveur lors de la validation.</div>

            <div class="mb-3">
              <label for="nom" class="form-label">Nom</label>
              <input id="nom" name="nom" class="form-control" value="h">
              <div class="invalid-feedback" id="nomError"></div>
            </div>

            <div class="mb-3">
              <label for="prenom" class="form-label">Prénom</label>
              <input id="prenom" name="prenom" class="form-control">
              <div class="invalid-feedback" id="prenomError"></div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input id="email" name="email" class="form-control">
              <div class="invalid-feedback" id="emailError"></div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Mot de passe</label>
              <input id="password" name="password" type="password" class="form-control">
              <div class="invalid-feedback" id="passwordError"></div>
            </div>

            <div class="mb-3">
              <label for="confirm_password" class="form-label">Confirmation</label>
              <input id="confirm_password" name="confirm_password" type="password" class="form-control">
              <div class="invalid-feedback" id="confirmPasswordError"></div>
            </div>

            <div class="mb-3">
              <label for="telephone" class="form-label">Téléphone</label>
              <input id="telephone" name="telephone" class="form-control">
              <div class="invalid-feedback" id="telephoneError"></div>
            </div>

            <button class="btn btn-primary w-100" type="submit">S'inscrire</button>
          </form>

          <script src="Inscription_fichiers/validation-ajax.js" defer="defer"></script>
        </div>
        
      </div>
    </div>
  </div>
</div>

</body></html>
