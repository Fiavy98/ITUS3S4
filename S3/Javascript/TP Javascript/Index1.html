        function creerLigneTableau(pays) {
            return `<tr>
 <td>${pays.nom}</td>
 <td>${pays.capitale}</td>
 <td>${pays.superficie}</td>
 <td>${pays.population}</td>
 <td><img src="${pays.drapeau}" alt="Drapeau ${pays.nom}" class="drapeau"></td>
 <td>${pays.codePays}</td>
 </tr>`;   
        }

        function afficherPays() {
            console.log(pays);
 let tableauHTML = `<table>
 <tr>
 <th>Nom</th>
 <th>Capitale</th>
 <th>Superficie (km²)</th>
 <th>Population</th>
 <th>Drapeau</th>
 <th>Code Pays</th>
 </tr>`;
 pays.forEach(pays => {
 tableauHTML += creerLigneTableau(pays);
 });
 tableauHTML += '</table>';
 document.getElementById('tableauTousPays').innerHTML = tableauHTML;
 
        }

        function afficherPaysAleatoire() {
            const paysAleatoire = pays[Math.floor(Math.random() * pays.length)];
            console.log(paysAleatoire);
            
    
            let compteurs = JSON.parse(localStorage.getItem('compteursAffichage')) || {};
            compteurs[paysAleatoire.nom] = (compteurs[paysAleatoire.nom] || 0) + 1;
            localStorage.setItem('compteursAffichage', JSON.stringify(compteurs));
            
            let tableauHTML = `<table>
                <tr>
                    <th>Nom</th>
                    <th>Capitale</th>
                    <th>Superficie (km²)</th>
                    <th>Population</th>
                    <th>Drapeau</th>
                    <th>Code Pays</th>
                </tr>`;
            tableauHTML += creerLigneTableau(paysAleatoire);
            tableauHTML += '</table>';
            document.getElementById('tableauPaysAleatoire').innerHTML = tableauHTML;
        }
    </script>
