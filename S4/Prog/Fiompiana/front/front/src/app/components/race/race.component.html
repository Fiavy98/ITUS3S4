<section>
<h2>Liste des Races</h2>

<div *ngIf="error" style="color:red">{{error}}</div>

<form class="form-card" (ngSubmit)="save()">
  <div class="form-row">
    <div class="form-group">
      <label>Nom:</label>
      <input name="nom" [(ngModel)]="formModel.nom" required>
    </div>
  </div>
  <div class="form-button">
    <button type="submit" [disabled]="saving">Créer</button>
  </div>
</form>

<div *ngIf="loading">Chargement...</div>
<div *ngIf="!loading && !races.length">Aucune donnée.</div>

<table border="1" *ngIf="!loading && !error && races.length">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nom Race</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let race of races">
      <td>{{race.id}}</td>
      <td>{{race.nom}}</td>
    </tr>
  </tbody>
</table>

<br>

<a routerLink="/races/variationPoids">Variation Poids</a><br>
<a routerLink="/races/prix">Prix Race</a>
</section>
